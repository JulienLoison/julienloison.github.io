services:
  web:
    build:
      context: .docker
      args:
        NODE_VERSION: ${NODE_VERSION}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./web:/app
    command: ["npm", "run", "dev"]
    environment:
      NUXT_TELEMETRY_DISABLED: 1

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    volumes:
      - ./web:/app
    ipc: host
    init: true
    working_dir: /app
    profiles:
      - e2e
